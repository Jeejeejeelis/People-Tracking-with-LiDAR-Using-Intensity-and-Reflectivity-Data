DATA_CONFIG:
  POINT_CLOUD_RANGE: [-54.0, -54.0, -5.0, 54.0, 54.0, 3.0]
  DATA_PROCESSOR:
  - NAME: mask_points_and_boxes_outside_range
    REMOVE_OUTSIDE_BOXES: true
  - NAME: shuffle_points
    SHUFFLE_ENABLED:
      test: true
      train: true
  - MAX_NUMBER_OF_VOXELS:
      test: 160000
      train: 120000
    MAX_POINTS_PER_VOXEL: 10
    NAME: transform_points_to_voxels
    VOXEL_SIZES:
    - - 0.05
      - 0.05
      - 0.2
    - - 0.075
      - 0.075
      - 0.2
  _BASE_CONFIG_: ../../configs/pfsd_dataset_enhanced.yaml
_BASE_CONFIG_: ../../configs/pfsd_hmfn.yaml
